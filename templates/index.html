<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Genome-scale Model Inspector</title>
  <link rel="stylesheet" href="/static/app.css?v={{ v }}">
</head>
<body>
<header class="topbar">
  <div>
    <h1>Genome-scale Model Inspector</h1>
    <p>Upload a COBRA model → inspect structure, objective, exchanges, and exchange essentiality.</p>
  </div>
</header>

<main class="container">
  <section class="upload-card">
    <label class="dropzone" id="dropzone">
      <input id="modelFile" type="file" accept=".xml,.sbml,.json,.yml,.yaml,.mat,.gz,.zip,.bz2">
      <strong>Drop a model here</strong>
      <span>or click to choose SBML/XML, JSON, YAML, MATLAB or compressed SBML</span>
    </label>

    <div class="diet-control">
      <label for="dietMode">Diet / media</label>
      <select id="dietMode">
        <option value="none" selected>Model's original bounds (no diet)</option>
        <option value="complete">Complete media (open all exchanges)</option>
        <option value="minimal">Minimal media (computed)</option>
        <option value="custom">Custom diet (upload file)</option>
      </select>
      <label class="dropzone dropzone-inline hidden" id="dietDropzone">
        <input id="dietFile" type="file" accept=".csv,.tsv,.txt">
        <strong>Drop a diet file here</strong>
        <span>or click to choose a CSV/TSV of (metabolite or exchange id, flux)</span>
      </label>
      <span id="dietFilename"></span>
    </div>

    <button id="analyzeBtn" disabled>Analyze model</button>
    <span id="filename"></span>
    <span id="status"></span>
    <div class="progress-track" id="mainProgress" style="display:none;"><div class="progress-fill"></div></div>
  </section>

  <section id="app" class="hidden">
    <div class="summary" id="summary"></div>

    <div class="app-toolbar">
      <button id="memotePill" type="button" class="memote-pill hidden" title="Go to the MEMOTE run on the Overview page"></button>
      <button id="reportBtn" type="button">📄 Generate report…</button>
    </div>

    <nav class="modnav" aria-label="Modules">
      <button class="modbtn active" data-module="overview">Overview</button>
      <button class="modbtn" data-module="diagnostics">Diagnostics &amp; Comparative Analyses</button>
      <button class="modbtn" data-module="debugging">Debugging Toolkit</button>
      <button class="modbtn" data-module="annotation">Annotation &amp; Translation</button>
      <button class="modbtn modbtn-right" data-module="references">References</button>
    </nav>

    <nav class="subnav" data-module="overview">
      <button class="tab active" data-tab="overview">Summary</button>
      <button class="tab" data-tab="metabolites">Metabolites</button>
      <button class="tab" data-tab="reactions">Reactions</button>
      <button class="tab" data-tab="objective">Objective</button>
    </nav>
    <nav class="subnav hidden" data-module="diagnostics">
      <button class="tab" data-tab="minmed">Minimal Medium</button>
      <button class="tab" data-tab="exchanges">Exchange essentiality</button>
      <button class="tab" data-tab="gaps">Network Gaps &amp; Audits</button>
      <button class="tab" data-tab="balance">Reaction Balance</button>
      <button class="tab" data-tab="precursors">Biomass Precursors</button>
      <button class="tab" data-tab="frog">FROG Report</button>
    </nav>
    <nav class="subnav hidden" data-module="debugging">
      <button class="tab" data-tab="debug" id="debugTab">Exchange Debugging</button>
      <button class="tab" data-tab="tracer">Pathway Tracer</button>
    </nav>
    <nav class="subnav hidden" data-module="annotation">
      <button class="tab" data-tab="annotation">ID namespaces &amp; annotation</button>
    </nav>

    <section id="overview" class="panel active"></section>
    <section id="metabolites" class="panel"></section>
    <section id="reactions" class="panel"></section>
    <section id="objective" class="panel"></section>
    <section id="minmed" class="panel"></section>
    <section id="exchanges" class="panel"></section>
    <section id="debug" class="panel"></section>
    <section id="tracer" class="panel"></section>
    <section id="gaps" class="panel"></section>
    <section id="frog" class="panel"></section>
    <section id="balance" class="panel"></section>
    <section id="precursors" class="panel"></section>
    <section id="annotation" class="panel"></section>
    <section id="references" class="panel"></section>
  </section>
</main>

<div id="reportModalRoot"></div>

<script src="/static/vendor/cytoscape.min.js"></script>
<script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
